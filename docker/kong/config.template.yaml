_format_version: "3.0"
_transform: true

services:
  - name: app-orders
    # url: http://host.docker.internal:3333 DEV
    url: ${ORDERS_SERVICE_URL}
    path: /
    routes:
      - name: api-orders
        protocols:
          - http
          - https
        paths:
          - /orders

  - name: app-invoices
    # url: http://host.docker.internal:3334
    url: ${INVOICES_SERVICE_URL}
    protocol: http
    host: host.docker.internal
    port: 3334
    path: /
    routes:
      - name: api-invoices
        protocols:
          - http
          - https
        paths:
          - /invoices

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Content-Type
        - Authorization
